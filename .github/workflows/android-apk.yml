
name: Build RETAIL INDIA APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - 
      - name: Install Android SDK tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Extract project
        run: unzip -q RETAIL-INDIA-GITHUB-UPLOAD.zip

      - name: Install dependencies
        working-directory: retail-india-production
        run: npm install

      - name: Build web app
        working-directory: retail-india-production
        run: npm run build

      - name: Add Android
        working-directory: retail-india-production
        run: npx cap add android

      - name: Sync Android
        working-directory: retail-india-production
        run: npx cap sync android

      - name: Build APK
        working-directory: retail-india-production/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RETAIL-INDIA-APK
          path: retail-india-production/android/app/build/outputs/apk/debug/app-debug.apk

